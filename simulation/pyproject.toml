[project]
name = "furima-sim"
version = "0.1.0"
description = "Deterministic Mesa sidecar for the Furima Sandbox marketplace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "mesa==3.5.1",
  # Mesa 3.5.1 imports its Network space at package import time but does not
  # declare networkx in the core wheel metadata.
  "networkx==3.5",
  "pydantic==2.12.5",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["furima_sim"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
