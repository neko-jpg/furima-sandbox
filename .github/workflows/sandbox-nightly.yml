name: sandbox-nightly

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check semgrep==1.173.0
      - run: npm run typecheck
      - run: npm run framework:check
      - run: npx wrangler types worker/generated-env.d.ts --include-runtime=false --check
      - run: npm run qa:static
      - run: npm run docs:check
      - run: npm run qa:matrix
      - run: npm run db:migrate:local
      - run: npm run test:unit
      - name: npm audit (advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  full-sandbox-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:local
      - run: npm run build
      - run: npm run test:rendered
      - run: npm run e2e
      - run: npm run load:full
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sandbox-nightly-artifacts
          path: |
            output/load/latest.json
            output/playwright/report
            test-results
          if-no-files-found: ignore
