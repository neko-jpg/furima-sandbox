name: sandbox-nightly

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  full-sandbox-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check --no-cache-dir semgrep==1.173.0
      - run: npm run build
      - run: npm run typecheck
      - run: npm run qa:static
      - run: npm run docs:check
      - run: npm run qa:matrix
      - run: npm run db:migrate:local
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run load:full
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-nightly-artifacts
          path: |
            output/load/latest.json
            output/playwright/report
            test-results
          if-no-files-found: ignore
