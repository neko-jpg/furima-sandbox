name: fix-pr9-event-subscription

on:
  push:
    branches:
      - feat-pubsub-and-openapi-sync-1037851335825945285

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-pubsub-and-openapi-sync-1037851335825945285
      - name: Apply reviewed fix and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine_path = Path('app/domain/sandboxEngine.ts')
          text = engine_path.read_text()
          old = """    this.state.events = [...this.state.events.slice(-499), ...events];
              return events;
          """
          new = """    this.state.events = [...this.state.events.slice(-499), ...events];
              if (events.length && this.eventSubscribers.size) {
                const subscribers = [...this.eventSubscribers];
                for (const event of events) {
                  const eventSnapshot = clone(event);
                  queueMicrotask(() => {
                    for (const subscriber of subscribers) {
                      try {
                        subscriber(clone(eventSnapshot));
                      } catch {
                        // A subscriber must never roll back or corrupt committed domain state.
                      }
                    }
                  });
                }
              }
              return events;
          """
          if old not in text:
              raise SystemExit('sandboxEngine commit target not found')
          engine_path.write_text(text.replace(old, new, 1))

          package_path = Path('package.json')
          package_text = package_path.read_text()
          old_test = 'tests/domain-engine.test.mjs tests/listing-contract.test.mjs'
          new_test = 'tests/domain-engine.test.mjs tests/domain-event-subscription.test.mjs tests/listing-contract.test.mjs'
          if old_test not in package_text:
              raise SystemExit('package test target not found')
          package_path.write_text(package_text.replace(old_test, new_test, 1))
          PY

          cat > tests/domain-event-subscription.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';

          import { SandboxEngine } from '../app/domain/sandboxEngine.ts';

          const flushMicrotasks = () => new Promise((resolve) => queueMicrotask(resolve));

          test('domain event subscribers receive committed events and can unsubscribe', async () => {
            const engine = new SandboxEngine([]);
            const received = [];
            const unsubscribe = engine.subscribe((event) => received.push(event));

            const deposit = engine.depositWallet(100, { actorId: 'buyer_01' });
            assert.equal(deposit.ok, true);
            await flushMicrotasks();
            assert.equal(received.length, 1);
            assert.equal(received[0].type, 'WALLET_DEPOSITED');
            assert.equal(received[0].stateVersion, deposit.stateVersion);

            unsubscribe();
            const withdrawal = engine.withdrawWallet(50, { actorId: 'buyer_01' });
            assert.equal(withdrawal.ok, true);
            await flushMicrotasks();
            assert.equal(received.length, 1);
          });
          EOF

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/domain/sandboxEngine.ts package.json tests/domain-event-subscription.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: dispatch committed domain events to subscribers'
          git push origin HEAD:feat-pubsub-and-openapi-sync-1037851335825945285
