name: sync-pr9-with-main

on:
  push:
    branches:
      - feat-pubsub-and-openapi-sync-1037851335825945285

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-pubsub-and-openapi-sync-1037851335825945285
          fetch-depth: 0
      - name: Merge latest main while preserving both feature sets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$unresolved" | grep -vE '^(package.json|package-lock.json)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              echo "$unexpected"
              exit 1
            fi

            if printf '%s\n' "$unresolved" | grep -qx 'package.json'; then
              git show :2:package.json > /tmp/package-ours.json
              git show :3:package.json > /tmp/package-main.json
              python - <<'PY'
          import json
          from pathlib import Path

          ours = json.loads(Path('/tmp/package-ours.json').read_text())
          main = json.loads(Path('/tmp/package-main.json').read_text())

          ours.setdefault('scripts', {})
          for key, value in main.get('scripts', {}).items():
              ours['scripts'].setdefault(key, value)

          for section in ('dependencies', 'devDependencies'):
              ours.setdefault(section, {})
              for key, value in main.get(section, {}).items():
                  ours[section].setdefault(key, value)
              ours[section] = dict(sorted(ours[section].items()))

          Path('package.json').write_text(json.dumps(ours, ensure_ascii=False, indent=2) + '\n')
          PY
              git add package.json
            fi

            if printf '%s\n' "$unresolved" | grep -qx 'package-lock.json'; then
              git checkout --ours package-lock.json
              git add package-lock.json
            fi
          fi

          npm install --package-lock-only --ignore-scripts
          git add package.json package-lock.json

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unresolved conflicts remain:"
            echo "$remaining"
            exit 1
          fi

          git commit -m 'chore: sync PR with MCP-enabled main'
          git push origin HEAD:feat-pubsub-and-openapi-sync-1037851335825945285
