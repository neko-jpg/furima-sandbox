name: docs-pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/api/**'
      - 'scripts/build-docs-site.mjs'
      - 'scripts/validate-docs-public.mjs'
      - 'scripts/validate-api-docs.mjs'
      - 'scripts/validate-test-matrix.mjs'
      - 'app/types/mercari.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run qa:matrix
      - run: npm run docs:validate-public
      - run: npm run docs:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
