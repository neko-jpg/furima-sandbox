name: docs-cloudflare-pages

on:
  workflow_run:
    workflows: [verify]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-docs
  cancel-in-progress: false

jobs:
  detect_changes:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.paths.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Detect API docs deployment changes
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          if [[ -z "$base_sha" ]]; then
            echo "Unable to resolve the parent commit; enabling the fail-safe deployment path."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base_sha" "$HEAD_SHA" -- \
            docs/api \
            docs/scalar-entry.js \
            docs/site-entry.js \
            docs/favicon.svg \
            scripts/build-docs-site.mjs \
            package.json \
            package-lock.json; then
            echo "No API docs deployment source changed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "An API docs deployment source changed."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  verify_and_deploy:
    name: verify-and-deploy
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: https://mercari-ui-kit-api-docs.pages.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run qa:matrix
      - run: npm run docs:site
      - run: npm run docs:validate-public
      - name: Deploy API docs to Cloudflare Pages
        run: npx wrangler pages deploy output/docs-site --project-name mercari-ui-kit-api-docs --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify latest deployment is visible
        run: npx wrangler pages deployment list --project-name mercari-ui-kit-api-docs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  docs_status:
    name: docs-status
    needs: [detect_changes, verify_and_deploy]
    if: ${{ always() && needs.detect_changes.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm docs workflow result
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect_changes.result }}
          DEPLOY_RESULT: ${{ needs.verify_and_deploy.result }}
          DEPLOY_REQUESTED: ${{ needs.detect_changes.outputs.deploy }}
        run: |
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "API docs change detection did not succeed: $DETECT_RESULT"
            exit 1
          fi

          if [[ "$DEPLOY_REQUESTED" == "true" && "$DEPLOY_RESULT" != "success" ]]; then
            echo "API docs deployment was requested but did not succeed: $DEPLOY_RESULT"
            exit 1
          fi

          if [[ "$DEPLOY_REQUESTED" != "true" && "$DEPLOY_RESULT" != "skipped" ]]; then
            echo "API docs deployment should have been skipped but was: $DEPLOY_RESULT"
            exit 1
          fi

          if [[ "$DEPLOY_RESULT" == "skipped" ]]; then
            echo "No API docs deployment was required; CD completed without changing Cloudflare."
          else
            echo "API docs deployment and verification succeeded."
          fi
