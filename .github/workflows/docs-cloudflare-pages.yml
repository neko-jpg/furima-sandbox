name: docs-cloudflare-pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/api/**'
      - 'docs/scalar-entry.js'
      - 'scripts/build-docs-site.mjs'
      - 'scripts/validate-docs-public.mjs'
      - 'scripts/validate-api-docs.mjs'
      - 'scripts/validate-test-matrix.mjs'
      - 'app/types/mercari.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-docs
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: https://mercari-ui-kit-api-docs.pages.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run qa:matrix
      - run: npm run docs:site
      - run: npm run docs:validate-public
      - name: Deploy API docs to Cloudflare Pages
        run: npx wrangler pages deploy output/docs-site --project-name mercari-ui-kit-api-docs --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify latest deployment is visible
        run: npx wrangler pages deployment list --project-name mercari-ui-kit-api-docs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
