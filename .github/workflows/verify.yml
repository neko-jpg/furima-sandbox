name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check --no-cache-dir semgrep==1.173.0
      - run: npm run build
      - run: npm run typecheck
      - run: npm run framework:check
      - run: npx wrangler types worker/generated-env.d.ts --include-runtime=false --check
      - run: npm run types:sync
      - run: git diff --quiet app/types/openapi.d.ts app/types/mercari.ts
      - run: npm run lint
      - run: npm run qa:static
      - run: npm run qa:matrix
      - run: npm run docs:check
      - run: npm run db:migrate:local
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - run: npm run load:smoke
      - name: npm audit (advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - run: npm run assets:audit
