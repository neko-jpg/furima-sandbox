openapi: 3.1.0
info:
  title: Furima Sandbox API
  version: 1.0.0
  description: |
    Furima Sandboxのカタログ、Sandbox状態、出品下書き・出品ライフサイクルAPI。
    このファイルがAPI契約の正本です。GitHub Wikiはチーム向けの読み物として本ファイルへリンクします。
    /api/catalog、/api/catalog/{itemId}、/api/sandbox/state、/api/sandbox/health、/api/sandbox/preview、/api/sandbox/commit、/api/sandbox/reset、/api/sandbox/seed、/api/sandbox/replayは現在のHTTP実装です。
    撮影アシスタントの5 APIはfixture/liveのPythonサービスが実装するHTTP契約です。Team-D backendの統合基準は最新mainのcd7b42a207fc3912fdd5e8e76ac2e91f7f5f5abeです（初期基準be5ee304febe14b280fa546fa3cc9704b84e6e8から更新）。画像はmultipartのbinaryとして扱い、秘密値や画像Data URLをこの仕様へ含めません。
    /api/listings、/api/wallet、/api/profile、/api/follows系はplanned contractです。現時点のHTTP runtimeは未実装で、実行経路はBrowser APIです。planned操作にはx-implementation-status: plannedを付けています。
servers:
  - url: /
    description: Local or deployed application origin
tags:
  - name: Catalog
  - name: Sandbox State
  - name: Listings
  - name: Wallet
  - name: Profile
  - name: Social
  - name: Guided Capture
paths:
  /api/catalog:
    get:
      tags: [Catalog]
      summary: 商品カタログをページ取得する
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 商品ページ
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Catalog-Total: { schema: { type: integer } }
            X-Catalog-Offset: { schema: { type: integer } }
            X-Catalog-Limit: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: array
                maxItems: 40
                items: { $ref: '#/components/schemas/MercariItem' }
        '304':
          description: If-None-Matchに一致したため変更なし
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/catalog/{itemId}:
    get:
      tags: [Catalog]
      summary: 商品を1件取得する
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 商品
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MercariItem' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/sandbox/state:
    get:
      operationId: getSandboxState
      tags: [Sandbox State]
      summary: Sandbox状態を取得する
      security: [{ controlBearerAuth: [] }]
      parameters:
        - name: id
          in: query
          schema: { type: string, minLength: 1, pattern: '^[A-Za-z0-9_-]{1,80}$', example: schemathesis }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Sandbox状態
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxState' }
        '304': { description: 変更なし }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: putSandboxState
      tags: [Sandbox State]
      summary: Sandbox状態を楽観的に更新する
      security: [{ controlBearerAuth: [] }]
      parameters:
        - name: id
          in: query
          schema: { type: string, minLength: 1, pattern: '^[A-Za-z0-9_-]{1,80}$', example: schemathesis }
        - name: If-Match-State-Version
          in: header
          required: false
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxState' }
      responses:
        '200':
          description: 保存済み状態
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, sandboxId, stateVersion]
                additionalProperties: false
                properties:
                  ok: { const: true }
                  id: { type: string }
                  sandboxId: { type: string }
                  stateVersion: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: 状態が8MiBを超えた }
  /api/sandbox/health:
    get:
      tags: [Sandbox State]
      summary: Sandboxの永続化・実行境界を確認する
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sandboxId
          in: query
          schema: { type: string, minLength: 1, pattern: '^[A-Za-z0-9_-]{1,80}$', example: schemathesis }
      responses:
        '200':
          description: Sandbox health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/sandbox/preview:
    post:
      operationId: previewSandboxAction
      tags: [Sandbox State]
      summary: Sandboxコピー上でcommandをシミュレーションする
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxPreviewInput' }
      responses:
        '200':
          description: preview結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResultPreview' }
          links:
            CommitSandboxPreview:
              operationId: commitSandboxPreview
              requestBody:
                sandboxId: $request.body#/sandboxId
                previewId: $response.body#/data/previewId
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: payloadが8MiBを超えた }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/sandbox/commit:
    post:
      operationId: commitSandboxPreview
      tags: [Sandbox State]
      summary: 未使用・未期限切れのpreviewを確定する
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxCommitInput' }
      responses:
        '200':
          description: commit結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/sandbox/reset:
    post:
      operationId: resetSandbox
      tags: [Sandbox State]
      summary: Sandboxをシナリオ初期状態へ戻す
      security: [{ controlBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxSeedInput' }
      responses:
        '200':
          description: リセット済みSandbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxOperationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { description: JSON bodyのContent-Typeが必要 }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/sandbox/seed:
    post:
      operationId: seedSandbox
      tags: [Sandbox State]
      summary: 決定的なseedとシナリオでSandboxを作成する
      security: [{ controlBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxSeedInput' }
      responses:
        '200':
          description: seed済みSandbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxOperationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { description: JSON bodyのContent-Typeが必要 }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/sandbox/replay:
    post:
      operationId: replaySandbox
      tags: [Sandbox State]
      summary: Sandbox command列を決定的に再生する
      security: [{ controlBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxReplayInput' }
      responses:
        '200':
          description: 再生後のSandbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxReplayResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { description: JSON bodyのContent-Typeが必要 }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: command列の途中で失敗した }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/livekit-token:
    x-implementation-status: python-service
    post:
      tags: [Guided Capture]
      operationId: issueLiveKitToken
      summary: 撮影セッション用の短期LiveKit tokenを発行する
      description: LiveKitの秘密鍵はサーバー内に保持し、ブラウザには撮影用の短期tokenと接続メタデータだけを返します。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveKitTokenRequest' }
      responses:
        '200':
          description: 撮影セッション用LiveKit接続情報
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveKitTokenResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ProviderFailure' }
  /api/analyze-shot:
    x-implementation-status: python-service
    post:
      tags: [Guided Capture]
      operationId: analyzeShot
      summary: 撮影後の正面・背面・タグ画像を判定する
      description: measurement画像はこのAPIへ送信せず、撮影後のShotAssessmentは採寸幾何検証と分離します。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ShotAnalysisUpload' }
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: 厳格に検証された撮影判定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShotAssessment' }
        '413': { $ref: '#/components/responses/ProviderFailure' }
        '415': { $ref: '#/components/responses/ProviderFailure' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/ProviderFailure' }
        '503': { $ref: '#/components/responses/ProviderFailure' }
        '504': { $ref: '#/components/responses/ProviderFailure' }
  /api/suggest-measurement-points:
    x-implementation-status: python-service
    post:
      tags: [Guided Capture]
      operationId: suggestMeasurementPoints
      summary: 採寸画像から4端点を提案する
      description: 出力は0〜1の正規化された4端点だけです。cm値、confidence、画面遷移、UI文言は返しません。採寸値の算出、必要に応じた射影補正、端点編集、承認はブラウザ側で行います。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MeasurementPointsUpload' }
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: 採寸4端点の未承認提案
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementPointSuggestion' }
        '413': { $ref: '#/components/responses/ProviderFailure' }
        '415': { $ref: '#/components/responses/ProviderFailure' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/ProviderFailure' }
        '503': { $ref: '#/components/responses/ProviderFailure' }
        '504': { $ref: '#/components/responses/ProviderFailure' }
  /api/remove-background:
    x-implementation-status: python-service
    post:
      tags: [Guided Capture]
      operationId: removeBackground
      summary: 正面原本からmask-only PNGを作る
      description: 正面原本だけを内部のmask providerへ送り、商品RGBを含まないmask-only PNGを返します。rembgはブラウザへ公開しません。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/FrontImageUpload' }
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: 正面原本と同じ寸法のmask-only PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        '413': { $ref: '#/components/responses/ProviderFailure' }
        '415': { $ref: '#/components/responses/ProviderFailure' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/ProviderFailure' }
        '503': { $ref: '#/components/responses/ProviderFailure' }
        '504': { $ref: '#/components/responses/ProviderFailure' }
  /api/generate-background:
    x-implementation-status: python-service
    post:
      tags: [Guided Capture]
      operationId: generateBackground
      summary: 許可されたstyleから商品を含まない背景を生成する
      description: styleIdを固定promptへ変換し、背景生成サービスへテキストだけを送ります。商品画像、mask、タグ画像、採寸画像はrequestに含めません。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackgroundGenerationRequest' }
      responses:
        '200':
          description: 商品を含まない背景PNG候補
          content:
            image/png:
              schema: { type: string, format: binary }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/ProviderFailure' }
        '503': { $ref: '#/components/responses/ProviderFailure' }
        '504': { $ref: '#/components/responses/ProviderFailure' }
  /api/listings:
    x-implementation-status: planned
    get:
      tags: [Listings]
      summary: 自分の出品を取得する
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 出品一覧
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MercariItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/listings/{itemId}:
    x-implementation-status: planned
    patch:
      tags: [Listings]
      summary: 出品を更新する
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/IfMatchStateVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingUpdate' }
      responses:
        '200':
          description: 更新済み出品
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    post:
      tags: [Listings]
      summary: 出品操作（pause/resume/relist）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation]
              properties:
                operation: { type: string, enum: [pause, resume, relist] }
      responses:
        '200':
          description: 操作結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/wallet:
    x-implementation-status: planned
    get:
      tags: [Wallet]
      summary: 自分のSandboxウォレットと台帳を取得する
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: ウォレットスナップショット
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResultWallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/wallet/deposit:
    x-implementation-status: planned
    post:
      tags: [Wallet]
      summary: Sandbox残高へ入金する
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatchStateVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletAmountInput' }
      responses:
        '200':
          description: 入金後のウォレット
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResultWallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/wallet/withdraw:
    x-implementation-status: planned
    post:
      tags: [Wallet]
      summary: 利用可能残高から出金する
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatchStateVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletAmountInput' }
      responses:
        '200':
          description: 出金後のウォレット
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResultWallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/profile:
    x-implementation-status: planned
    get:
      tags: [Profile]
      summary: 自分の表示プロフィールを取得する
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 表示プロフィール
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActorProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      summary: 表示名・自己紹介・画像参照を更新する
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatchStateVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: 更新後プロフィール
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActorProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/follows:
    x-implementation-status: planned
    get:
      tags: [Social]
      summary: 自分のフォロー中・フォロワー一覧を取得する
      security: [{ bearerAuth: [] }]
      parameters:
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [following, followers] }
      responses:
        '200':
          description: フォロー一覧
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResultFollowList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/follows/{actorId}:
    x-implementation-status: planned
    parameters:
      - name: actorId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 80 }
    post:
      tags: [Social]
      summary: ユーザーをフォローする
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatchStateVersion'
      responses:
        '200':
          description: フォロー後の関係
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResultFollowMutation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Social]
      summary: ユーザーのフォローを解除する
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatchStateVersion'
      responses:
        '200':
          description: フォロー解除後の関係
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResultFollowMutation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/follows/{actorId}/summary:
    x-implementation-status: planned
    get:
      tags: [Social]
      summary: 公開フォロー数と自分のフォロー状態を取得する
      security: [{ bearerAuth: [] }]
      parameters:
        - name: actorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: フォロー概要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResultFollowSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    controlBearerAuth:
      type: http
      scheme: bearer
      description: Sandbox全体状態を扱うoperator/control token。通常のAPI tokenでは利用できません。
  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 160, example: demo-000001 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 9007199254740991, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 40, default: 24 }
    IfMatchStateVersion:
      name: If-Match-State-Version
      in: header
      schema: { type: integer, minimum: 0 }
  headers:
    ETag:
      description: リソースのバージョン
      schema: { type: string }
  responses:
    BadRequest:
      description: 入力が不正
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 認証が必要
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 権限不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: stateVersionまたはETagが競合
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: リソースが存在しない
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: D1など依存サービスが利用できない
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ProviderFailure:
      description: 撮影アシスタントのproviderが入力不正、timeout、利用不能、または不正な応答を返した
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProviderErrorResponse' }
    ValidationError:
      description: リクエストの形式または値が不正
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
  schemas:
    SessionSlot:
      type: string
      enum: [front, back, tag, measurement]
      description: 撮影セッション内の固定4slot。measurementは出品画像へ使用しません。
    ShotSlot:
      type: string
      enum: [front, back, tag]
      description: 撮影後ShotAssessmentが判定できる3slot。measurementは含みません。
    GuidanceCode:
      type: string
      enum: [MOVE_CLOSER, MOVE_FARTHER, CENTER_GARMENT, SHOW_FULL_GARMENT, WRONG_SIDE, MOVE_TO_TAG, PLACE_MARKER, MARKER_NOT_VISIBLE, FLATTEN_GARMENT, CAMERA_OVERHEAD, HOLD_STEADY, READY, AGENT_UNAVAILABLE]
    GuidanceEvent:
      type: object
      additionalProperties: false
      required: [sessionId, sequence, shot, code, message, confidence, observedAt, expiresAt]
      properties:
        sessionId: { type: string, minLength: 1, maxLength: 96, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,95}$' }
        sequence: { type: integer, minimum: 1 }
        shot: { $ref: '#/components/schemas/SessionSlot' }
        code: { $ref: '#/components/schemas/GuidanceCode' }
        message: { type: string, minLength: 1, maxLength: 240 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        observedAt: { type: integer, minimum: 0, description: Unix epoch milliseconds }
        expiresAt: { type: integer, minimum: 0, description: Unix epoch milliseconds。observedAtより後である必要があります。 }
    ConnectionState:
      type: string
      enum: [connecting, connected, reconnecting, disconnected]
    ProviderName:
      type: string
      enum: [shot-assessor, vision-guidance, measurement-line, background-generator, garment-masker]
    ProviderErrorCode:
      type: string
      enum: [TIMEOUT, UNAVAILABLE, INVALID_RESPONSE, INVALID_INPUT, UNKNOWN]
    ProviderError:
      type: object
      additionalProperties: false
      required: [provider, code, message, retryable]
      properties:
        provider: { $ref: '#/components/schemas/ProviderName' }
        code: { $ref: '#/components/schemas/ProviderErrorCode' }
        message: { type: string, minLength: 1, maxLength: 240 }
        retryable: { type: boolean }
    ProviderErrorResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          oneOf:
            - { type: string, minLength: 1, maxLength: 120 }
            - { $ref: '#/components/schemas/ProviderError' }
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          oneOf:
            - { type: string, minLength: 1, maxLength: 240 }
            - type: array
              items: { type: object, additionalProperties: true }
    LiveKitTokenRequest:
      type: object
      additionalProperties: false
      required: [sessionId]
      properties:
        sessionId: { type: string, minLength: 1, maxLength: 96, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,95}$' }
    LiveKitTokenResponse:
      type: object
      additionalProperties: false
      required: [token, participantIdentity, roomName, expiresAt, livekitUrl]
      properties:
        token: { type: string, minLength: 1, description: 短期のブラウザ接続token。実値やsecretは公開仕様へ記載しません。 }
        participantIdentity: { type: string, minLength: 1, maxLength: 128 }
        roomName: { type: string, minLength: 1, maxLength: 128 }
        expiresAt: { type: integer, minimum: 1, description: Unix epoch seconds }
        livekitUrl: { type: string, pattern: '^(https|wss)://[^\s]+$' }
    ShotIssueCode:
      type: string
      enum: [TOO_DARK, TOO_BRIGHT, TOO_BLURRY, BLURRY, GARMENT_CROPPED, TAG_UNREADABLE, WRONG_SHOT]
    ShotType:
      type: string
      enum: [front, back, tag, unknown]
    ShotQuality:
      type: string
      enum: [ok, retry]
    NextAction:
      type: string
      enum: [RETAKE, REQUEST_NEXT, COMPLETE]
    ShotAssessment:
      type: object
      additionalProperties: false
      required: [shotType, quality, issues, missingShots, nextAction]
      properties:
        shotType: { $ref: '#/components/schemas/ShotType' }
        quality: { $ref: '#/components/schemas/ShotQuality' }
        issues:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { $ref: '#/components/schemas/ShotIssueCode' }
        missingShots:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { $ref: '#/components/schemas/ShotSlot' }
        nextAction: { $ref: '#/components/schemas/NextAction' }
    NormalizedPoint:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
    MeasurementEndpoints:
      type: object
      additionalProperties: false
      required: [lengthStart, lengthEnd, widthStart, widthEnd]
      properties:
        lengthStart: { $ref: '#/components/schemas/NormalizedPoint' }
        lengthEnd: { $ref: '#/components/schemas/NormalizedPoint' }
        widthStart: { $ref: '#/components/schemas/NormalizedPoint' }
        widthEnd: { $ref: '#/components/schemas/NormalizedPoint' }
    MeasurementPointSuggestion:
      type: object
      additionalProperties: false
      required: [lengthStart, lengthEnd, widthStart, widthEnd]
      properties:
        lengthStart: { $ref: '#/components/schemas/NormalizedPoint' }
        lengthEnd: { $ref: '#/components/schemas/NormalizedPoint' }
        widthStart: { $ref: '#/components/schemas/NormalizedPoint' }
        widthEnd: { $ref: '#/components/schemas/NormalizedPoint' }
    MeasurementMarker:
      type: object
      additionalProperties: false
      required: [knownSideCm, corners, pxPerCm]
      properties:
        knownSideCm: { const: 5, description: 専用マーカー外形1辺のcm値 }
        corners:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/NormalizedPoint' }
        pxPerCm: { type: number, exclusiveMinimum: 0 }
    MeasurementLine:
      type: object
      additionalProperties: false
      required: [start, end, valueCm]
      properties:
        start: { $ref: '#/components/schemas/NormalizedPoint' }
        end: { $ref: '#/components/schemas/NormalizedPoint' }
        valueCm: { type: number, exclusiveMinimum: 0 }
    MeasurementSource:
      type: string
      enum: [ai, contour, user]
    MeasurementStatus:
      type: string
      enum: [needs_review, approved_cv, approved_manual]
    MeasurementFailureCode:
      type: string
      enum: [MARKER_MISSING, MARKER_MULTIPLE, MARKER_TOO_SMALL, MARKER_OCCLUDED, GARMENT_OUT_OF_FRAME, GARMENT_MARKER_OVERLAP, SEGMENTATION_FAILED, ENDPOINTS_INVALID]
    MeasurementDraft:
      type: object
      additionalProperties: false
      required: [imageId, marker, length, width, source, status]
      properties:
        imageId: { type: string, minLength: 1, maxLength: 160, description: セッション内の一時参照。出品データへ保存しません。 }
        marker:
          oneOf:
            - { $ref: '#/components/schemas/MeasurementMarker' }
            - { type: 'null' }
        length: { $ref: '#/components/schemas/MeasurementLine' }
        width: { $ref: '#/components/schemas/MeasurementLine' }
        source: { $ref: '#/components/schemas/MeasurementSource' }
        status: { $ref: '#/components/schemas/MeasurementStatus' }
    ApprovedMeasurement:
      type: object
      additionalProperties: false
      required: [imageId, marker, length, width, source, status]
      properties:
        imageId: { type: string, minLength: 1, maxLength: 160, description: セッション内の一時参照。出品データへ保存しません。 }
        marker:
          oneOf:
            - { $ref: '#/components/schemas/MeasurementMarker' }
            - { type: 'null' }
        length: { $ref: '#/components/schemas/MeasurementLine' }
        width: { $ref: '#/components/schemas/MeasurementLine' }
        source: { $ref: '#/components/schemas/MeasurementSource' }
        status: { type: string, enum: [approved_cv, approved_manual] }
    BackgroundStyleId:
      type: string
      enum: [studio_white, warm_neutral, light_wood]
    BackgroundGenerationRequest:
      type: object
      additionalProperties: false
      required: [styleId]
      properties:
        styleId: { $ref: '#/components/schemas/BackgroundStyleId' }
    ShotAnalysisUpload:
      type: object
      additionalProperties: false
      required: [requestedShot, file]
      properties:
        requestedShot: { $ref: '#/components/schemas/ShotSlot' }
        file: { type: string, format: binary, description: JPEG、PNG、またはWebPの撮影画像。最大10MiB。 }
    MeasurementPointsUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: { type: string, format: binary, description: JPEG、PNG、またはWebPの採寸画像。最大10MiB。 }
    FrontImageUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: { type: string, format: binary, description: front原本。mask生成専用で、生成背景へ転送しません。 }
    ListingMediaRef:
      type: object
      required: [id, source, status, mimeType, createdAt]
      properties:
        id: { type: string, pattern: '^media_[A-Za-z0-9_-]+$' }
        source: { type: string, enum: [camera, album, legacy] }
        status: { type: string, enum: [processing, ready, error] }
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp, image/avif, image/gif] }
        width: { type: integer, minimum: 1, maximum: 1600 }
        height: { type: integer, minimum: 1, maximum: 1600 }
        byteSize: { type: integer, minimum: 0, maximum: 10485760 }
        thumbnailRef: { type: string }
        createdAt: { type: string, format: date-time }
        errorCode: { type: string }
    WalletLedgerEntry:
      type: object
      required: [id, type, amount, referenceId, at]
      properties:
        id: { type: string }
        type: { type: string, enum: [DEPOSIT, WITHDRAWAL, HOLD, CAPTURE, REFUND, SALE, FEE] }
        amount: { type: integer, minimum: 1, maximum: 1000000 }
        referenceId: { type: string }
        at: { type: string, format: date-time }
    WalletSnapshot:
      type: object
      required: [actorId, openingBalance, availableBalance, heldBalance, points, ledger]
      properties:
        actorId: { type: string }
        openingBalance: { type: integer, minimum: 0 }
        availableBalance: { type: integer, minimum: 0 }
        heldBalance: { type: integer, minimum: 0 }
        points: { type: integer, minimum: 0 }
        ledger: { type: array, items: { $ref: '#/components/schemas/WalletLedgerEntry' } }
    WalletAmountInput:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, minimum: 1, maximum: 1000000 }
    ActorProfile:
      type: object
      required: [actorId, displayName, bio, avatar, rating, ratingsCount, completedSales, completedPurchases, isVerified, updatedAt]
      properties:
        actorId: { type: string }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        bio: { type: string, maxLength: 500 }
        avatar: { type: string }
        avatarRef: { type: string, pattern: '^media_[A-Za-z0-9_-]+$' }
        rating: { type: number, minimum: 0, maximum: 5 }
        ratingsCount: { type: integer, minimum: 0 }
        completedSales: { type: integer, minimum: 0 }
        completedPurchases: { type: integer, minimum: 0 }
        isVerified: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        bio: { type: string, maxLength: 500 }
        avatarRef: { type: string, pattern: '^media_[A-Za-z0-9_-]+$' }
    FollowRelation:
      type: object
      required: [id, followerId, followeeId, createdAt]
      properties:
        id: { type: string }
        followerId: { type: string }
        followeeId: { type: string }
        createdAt: { type: string, format: date-time }
    FollowSummary:
      type: object
      required: [actorId, followingCount, followerCount, isFollowing]
      properties:
        actorId: { type: string }
        followingCount: { type: integer, minimum: 0 }
        followerCount: { type: integer, minimum: 0 }
        isFollowing: { type: boolean }
    FollowListResult:
      type: object
      required: [actorId, direction, users, summary]
      properties:
        actorId: { type: string }
        direction: { type: string, enum: [following, followers] }
        users: { type: array, items: { $ref: '#/components/schemas/ActorProfile' } }
        summary: { $ref: '#/components/schemas/FollowSummary' }
    FollowMutationResult:
      type: object
      required: [actorId, targetActorId, following, summary]
      properties:
        actorId: { type: string }
        targetActorId: { type: string }
        following: { type: boolean }
        relation: { $ref: '#/components/schemas/FollowRelation' }
        summary: { $ref: '#/components/schemas/FollowSummary' }
    ActionResultFollowList:
      allOf:
        - $ref: '#/components/schemas/ActionResult'
    ActionResultFollowSummary:
      allOf:
        - $ref: '#/components/schemas/ActionResult'
    ActionResultFollowMutation:
      allOf:
        - $ref: '#/components/schemas/ActionResult'
    ActionResultWallet:
      allOf:
        - $ref: '#/components/schemas/ActionResult'
    MercariItem:
      type: object
      required: [id, title, price, description, category, condition, shippingFee, shippingMethod, origin, shippingDays]
      oneOf:
        - required: [images]
        - required: [imageRefs]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1, maxLength: 40 }
        price: { type: integer, minimum: 300, maximum: 9999999 }
        images:
          type: array
          maxItems: 20
          deprecated: true
          items: { type: string }
        imageRefs:
          type: array
          maxItems: 20
          items: { type: string, pattern: '^media_[A-Za-z0-9_-]+$' }
        description: { type: string, minLength: 1, maxLength: 1000 }
        category: { type: array, minItems: 1, items: { type: string } }
        condition: { type: string, enum: [新品・未使用, 未使用に近い, 目立った傷や汚れなし, やや傷や汚れあり, 傷や汚れあり, 全体的に状態が悪い] }
        shippingFee: { type: string }
        shippingMethod: { type: string, minLength: 1 }
        origin: { type: string }
        shippingDays: { type: string }
        shippingSize: { type: string }
        isAnonymousShipping: { type: boolean }
        inventoryPolicy: { type: string, enum: [SINGLE, MULTI] }
        inventoryQuantity: { type: integer, minimum: 0 }
        garmentMeasurements:
          type: object
          additionalProperties: false
          required: [lengthCm, widthCm, source]
          description: 明示承認後に出品下書きへ渡す採寸メタデータだけ。画像・端点・scaleは保存しません。
          properties:
            lengthCm: { type: number, exclusiveMinimum: 0 }
            widthCm: { type: number, exclusiveMinimum: 0 }
            source: { type: string, enum: [approved_cv, approved_manual] }
    ListingUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 40 }
        description: { type: string, maxLength: 1000 }
        price: { type: integer, minimum: 300, maximum: 9999999 }
        category: { type: array, minItems: 1, items: { type: string } }
        condition: { type: string, enum: [新品・未使用, 未使用に近い, 目立った傷や汚れなし, やや傷や汚れあり, 傷や汚れあり, 全体的に状態が悪い] }
        imageRefs: { type: array, maxItems: 20, items: { type: string, pattern: '^media_[A-Za-z0-9_-]+$' } }
    ActionIdentifier:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[A-Za-z0-9._:-]{1,200}$'
    SandboxState:
      type: object
      additionalProperties: false
      required: [version, sandboxId, scenarioId, seed, now, stateVersion, currentActorId, actors, items, purchaseIntents, transactions, payments, shipments, bids, reviews, inventoryMovements, events, notifications, wallets, follows, drafts, draftOwners, pendingFailures]
      properties:
        version: { const: '1' }
        sandboxId: { type: string, pattern: '^[A-Za-z0-9_-]{1,80}$' }
        scenarioId: { type: string }
        seed: { type: string }
        now: { type: string, format: date-time }
        stateVersion: { type: integer, minimum: 0 }
        uiRevision: { type: integer, minimum: 0 }
        idCounter: { type: integer, minimum: 0 }
        currentActorId: { type: string }
        actors: { type: array, items: { type: object, additionalProperties: true } }
        items: { type: array, items: { $ref: '#/components/schemas/MercariItem' } }
        purchaseIntents: { type: array, items: { type: object, additionalProperties: true } }
        transactions: { type: array, items: { type: object, additionalProperties: true } }
        payments: { type: array, items: { type: object, additionalProperties: true } }
        shipments: { type: array, items: { type: object, additionalProperties: true } }
        bids: { type: array, items: { type: object, additionalProperties: true } }
        reviews: { type: array, items: { type: object, additionalProperties: true } }
        returns: { type: array, items: { type: object, additionalProperties: true } }
        messages: { type: array, items: { type: object, additionalProperties: true } }
        supportTickets: { type: array, items: { type: object, additionalProperties: true } }
        profiles: { type: array, items: { type: object, additionalProperties: true } }
        inventoryMovements: { type: array, items: { type: object, additionalProperties: true } }
        events: { type: array, items: { type: object, additionalProperties: true } }
        notifications: { type: array, items: { type: object, additionalProperties: true } }
        wallets: { type: array, items: { $ref: '#/components/schemas/WalletSnapshot' } }
        follows: { type: array, items: { $ref: '#/components/schemas/FollowRelation' } }
        drafts: { type: object, additionalProperties: { type: object } }
        draftOwners: { type: object, additionalProperties: { type: string } }
        draftUpdatedAt: { type: object, additionalProperties: { type: string, format: date-time } }
        pendingFailures: { type: array, items: { type: string } }
    ActionResult:
      oneOf:
        - type: object
          required: [ok, data, stateVersion, meta]
          properties:
            ok: { const: true }
            data: {}
            stateVersion: { type: integer, minimum: 0 }
            meta: { $ref: '#/components/schemas/ActionMetadata' }
        - type: object
          required: [ok, error, stateVersion, meta]
          properties:
            ok: { const: false }
            error: { type: string }
            message: { type: string }
            stateVersion: { type: integer, minimum: 0 }
            meta: { $ref: '#/components/schemas/ActionMetadata' }
            details: {}
    ActionMetadata:
      type: object
      required: [sandboxId, actorId, stateVersion, operationId, mode]
      properties:
        sandboxId: { type: string, minLength: 1, pattern: '^[A-Za-z0-9_-]{1,80}$' }
        actorId: { $ref: '#/components/schemas/ActionIdentifier' }
        stateVersion: { type: integer, minimum: 0 }
        operationId: { $ref: '#/components/schemas/ActionIdentifier' }
        commandId: { $ref: '#/components/schemas/ActionIdentifier' }
        requestId: { $ref: '#/components/schemas/ActionIdentifier' }
        idempotencyKey: { $ref: '#/components/schemas/ActionIdentifier' }
        mode: { type: string, enum: [preview, commit] }
    SandboxPreviewInput:
      type: object
      additionalProperties: false
      required: [command, payload]
      properties:
        sandboxId: { type: string, minLength: 1, pattern: '^[A-Za-z0-9_-]{1,80}$', example: schemathesis }
        command: { type: string, enum: [purchase, listing.create, wallet.deposit, wallet.withdraw] }
        payload: { type: object }
        stateVersion: { type: integer, minimum: 0 }
        expectedStateVersion: { type: integer, minimum: 0 }
        operationId: { $ref: '#/components/schemas/ActionIdentifier' }
        commandId: { $ref: '#/components/schemas/ActionIdentifier' }
        requestId: { $ref: '#/components/schemas/ActionIdentifier' }
        idempotencyKey: { $ref: '#/components/schemas/ActionIdentifier' }
      allOf:
        - if:
            properties: { command: { const: purchase } }
            required: [command]
          then:
            properties:
              payload:
                type: object
                additionalProperties: false
                required: [itemId]
                properties:
                  itemId: { type: string, minLength: 1, maxLength: 160, example: demo-000001 }
                  pricing: { type: object, additionalProperties: true }
        - if:
            properties: { command: { const: listing.create } }
            required: [command]
          then:
            properties:
              payload:
                type: object
                required: [title, price, category]
                properties:
                  title: { type: string, minLength: 1, maxLength: 200, example: MCP security demo listing }
                  description: { type: string, maxLength: 1000 }
                  price: { type: integer, minimum: 300, maximum: 9999999, example: 1800 }
                  category: { type: array, minItems: 1, items: { type: string }, example: [その他] }
                  condition: { type: string }
                  imageRefs: { type: array, maxItems: 20, items: { type: string, pattern: '^media_[A-Za-z0-9_-]+$' } }
        - if:
            properties: { command: { enum: [wallet.deposit, wallet.withdraw] } }
            required: [command]
          then:
            properties:
              payload:
                type: object
                additionalProperties: false
                required: [amount]
                properties:
                  amount: { type: integer, minimum: 1, maximum: 1000000, example: 1000 }
    SandboxCommitInput:
      type: object
      additionalProperties: false
      required: [previewId, idempotencyKey]
      properties:
        sandboxId: { type: string, minLength: 1, pattern: '^[A-Za-z0-9_-]{1,80}$', example: schemathesis }
        previewId: { $ref: '#/components/schemas/ActionIdentifier' }
        stateVersion: { type: integer, minimum: 0 }
        expectedStateVersion: { type: integer, minimum: 0 }
        operationId: { $ref: '#/components/schemas/ActionIdentifier' }
        commandId: { $ref: '#/components/schemas/ActionIdentifier' }
        requestId: { $ref: '#/components/schemas/ActionIdentifier' }
        idempotencyKey: { $ref: '#/components/schemas/ActionIdentifier' }
    ActionResultPreview:
      allOf:
        - $ref: '#/components/schemas/ActionResult'
    SandboxHealth:
      type: object
      required: [ok, ready, sandboxId, stateVersion, storage, capabilities]
      properties:
        ok: { const: true }
        ready: { type: boolean }
        sandboxId: { type: string }
        stateVersion: { type: integer, minimum: 0 }
        storage: { type: string, enum: [memory, d1] }
        capabilities: { type: object, additionalProperties: { type: boolean } }
    SandboxSeedInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      allOf:
        - not: { required: [id, sandboxId] }
      properties:
        id: { type: string, minLength: 1, pattern: '^[A-Za-z0-9_-]{1,80}$', example: schemathesis }
        sandboxId: { type: string, minLength: 1, pattern: '^[A-Za-z0-9_-]{1,80}$', example: schemathesis }
        scenarioId: { type: string, enum: [catalog_default, purchase_happy_path, already_sold, multi_inventory, auction_outbid, listing_policy_blocked, zero_search_results, payment_timeout, delivery_delay], default: catalog_default }
        seed: { type: string, maxLength: 160 }
        expectedStateVersion: { type: integer, minimum: 0 }
        idempotencyKey: { $ref: '#/components/schemas/ActionIdentifier' }
    SandboxOperationResponse:
      type: object
      required: [ok, operation, sandboxId, stateVersion, state]
      properties:
        ok: { const: true }
        operation: { type: string, enum: [reset, seed] }
        sandboxId: { type: string }
        scenarioId: { type: string }
        seed: { type: string }
        stateVersion: { type: integer, minimum: 0 }
        state: { $ref: '#/components/schemas/SandboxState' }
    SandboxReplayInput:
      type: object
      additionalProperties: false
      required: [actions]
      allOf:
        - not: { required: [id, sandboxId] }
      properties:
        id: { type: string, minLength: 1, pattern: '^[A-Za-z0-9_-]{1,80}$', example: schemathesis }
        sandboxId: { type: string, minLength: 1, pattern: '^[A-Za-z0-9_-]{1,80}$', example: schemathesis }
        scenarioId: { type: string, enum: [catalog_default, purchase_happy_path, already_sold, multi_inventory, auction_outbid, listing_policy_blocked, zero_search_results, payment_timeout, delivery_delay], default: catalog_default }
        seed: { type: string, maxLength: 160 }
        baseState: { type: string, maxLength: 8388608 }
        fromStored:
          type: boolean
          description: 保存済みSandboxを現在のreplay基準にする場合はtrue。seed/reset直後の状態へ続けて操作する場合に指定する。
        expectedStateVersion: { type: integer, minimum: 0 }
        actions:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [command, idempotencyKey]
            properties:
              command: { type: string, enum: [listItem, createListingDraft, updateListingDraft, deleteListingDraft, submitListing, startPurchase, confirmPurchase, purchaseItem, buyItem, placeBid, closeAuction, shipOrder, markDelivered, reviewOrder, cancelOrder, resolveCancellation, reviewListing, requestReturn, confirmReturnReceived, sendTransactionMessage, createSupportTicket, reportTransaction, updateListing, pauseListing, resumeListing, relistItem, updateProfile, getFollowList, getFollowSummary, followUser, unfollowUser, depositWallet, withdrawWallet, switchActor, loadScenario, resetScenario, advanceClock, injectFailure, importState] }
              payload: { type: object, additionalProperties: true }
              idempotencyKey: { $ref: '#/components/schemas/ActionIdentifier' }
    SandboxReplayResponse:
      type: object
      required: [ok, operation, sandboxId, stateVersion, results, trace, state]
      properties:
        ok: { const: true }
        operation: { const: replay }
        sandboxId: { type: string }
        stateVersion: { type: integer, minimum: 0 }
        results: { type: array }
        trace: { type: array }
        state: { $ref: '#/components/schemas/SandboxState' }
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok: { const: false }
        error: { type: string }
        details: {}
