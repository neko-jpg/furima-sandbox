version: 1
purpose: "Furima Sandboxの実装境界とテスト証跡を1対1で追跡する"
policy:
  missingCoverage: fail
  unknownSourceItem: fail
  noUnclassifiedInteractiveControl: fail
inventories:
  routes:
    source: "app/api/**/route.ts"
    suite: api-contract
    evidence: "HTTP handlerの直接テスト、OpenAPI path、Worker smoke"
  browserApi:
    source: "app/types/mercari.ts#MercariAgentAPI"
    suite: browser-api-contract
    evidence: "window.__SHOP_API__ / window.__MERCARI_API__ のActionResult"
  errorCodes:
    source: "app/types/mercari.ts#AgentErrorCode"
    suite: error-code-contract
    evidence: "docs/api/error-codes.md と failure/retry分類"
  uiControls:
    source: "app/components/**/*.tsx"
    matcher: "button|a|input|textarea|select|onClick|onSubmit|onChange"
    suite: interactive-control-audit
    evidence: "Playwrightの全コントロール列挙、アクセシブル名、主要操作スモーク"
  persistence:
    source: "app/media/listingMediaStore.ts, app/domain/sandboxIdbStore.ts, app/domain/sandboxStore.ts, app/api/sandbox/state/route.ts, db/schema.ts"
    suite: persistence-boundaries
    evidence: "Memory/Fake IndexedDB/Fake D1/実D1契約"
  listingPhotoAssistantBackend:
    source: "services/listing_photo_assistant/**/*.py"
    suite: listing-photo-assistant-backend
    evidence: "uv run --frozen --no-sync pytest（fixture provider、API、provider契約、Agent状態機械）"
  listingPhotoAssistantCompose:
    source: "compose.yaml"
    suite: listing-photo-assistant-compose
    evidence: "npm run qa:assistant-compose、docker compose config --quiet、npm run smoke:assistant-compose"
suites:
  - id: seller-regression
    tests: ["tests/e2e/seller-mypage.spec.mjs"]
    priority: P0
  - id: navigation-history
    tests: ["tests/e2e/seller-mypage.spec.mjs", "tests/listing-contract.test.mjs"]
    priority: P0
  - id: browser-api-contract
    tests: ["tests/command-bus.test.mjs", "tests/sandbox-command-executor.test.mjs", "tests/sandbox-runtime.test.mjs", "tests/rendered-html.test.mjs", "tests/e2e/browser-api-preview.spec.mjs", "tests/e2e/sandbox-hardening.spec.mjs", "tests/e2e/sandbox-core-flows.spec.mjs"]
    priority: P0
  - id: api-contract
    tests: ["tests/api-contract.test.mjs", "tests/sandbox-runtime.test.mjs", "tests/e2e/sandbox-http-api.spec.mjs", "tests/e2e/sandbox-hardening.spec.mjs", "tests/e2e/sandbox-core-flows.spec.mjs"]
    priority: P0
  - id: error-code-contract
    tests: ["tests/api-contract.test.mjs", "tests/domain-engine.test.mjs"]
    priority: P0
  - id: interactive-control-audit
    tests: ["tests/e2e/interactive-controls.spec.mjs", "tests/e2e/accessibility-interactions.spec.mjs"]
    priority: P1
  - id: persistence-boundaries
    tests: ["tests/media-store.test.mjs", "tests/command-bus.test.mjs", "tests/sandbox-command-executor.test.mjs", "tests/sandbox-faults.test.mjs", "tests/worker-contract.test.mjs"]
    priority: P0
  - id: domain-properties
    tests: ["tests/domain-engine.test.mjs", "tests/sandbox-runtime.test.mjs", "tests/sandbox-properties.test.mjs", "tests/sandbox-model.test.mjs", "tests/e2e/sandbox-core-flows.spec.mjs"]
    priority: P0
  - id: security-static
    tests: ["semgrep/furima.yml", "tests/semgrep-contract.test.mjs"]
    priority: P1
  - id: performance
    tests: ["tests/e2e/performance.spec.mjs", "scripts/load-sandbox.mjs"]
    priority: P1
  - id: sandbox-scope
    tests: ["tests/e2e/sandbox-hardening.spec.mjs"]
    priority: P0
  - id: follow-relations
    tests: ["tests/domain-engine.test.mjs", "tests/e2e/sandbox-hardening.spec.mjs"]
    priority: P0
  - id: listing-photo-assistant-backend
    tests:
      - "services/listing_photo_assistant/tests/test_api.py"
      - "services/listing_photo_assistant/tests/test_config_and_factory.py"
      - "services/listing_photo_assistant/tests/test_guidance_and_live.py"
      - "services/listing_photo_assistant/tests/test_livekit_token.py"
      - "services/listing_photo_assistant/tests/test_mask.py"
      - "services/listing_photo_assistant/tests/test_measurement.py"
      - "services/listing_photo_assistant/tests/test_shot_assessor_contract.py"
      - "tests/test_measurement_provider.py"
    priority: P0
  - id: listing-photo-assistant-compose
    tests:
      - "scripts/validate-assistant-compose.mjs"
      - "scripts/smoke-listing-photo-assistant.mjs"
    priority: P0
